<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cyclohexane Card Render Preview</title>
  <style>
    :root {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color-scheme: dark;
      --bg: #0b1020;
      --panel: #151c2f;
      --panel2: #1d2740;
      --text: #f3f4f6;
      --muted: #a7b0c0;
      --border: #34405c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
    }
    .app-shell {
      width: min(760px, 100%);
      margin: 0 auto;
      padding: 16px;
      min-height: 100vh;
    }
    h1, p { margin-top: 0; }
    .muted { color: var(--muted); margin-bottom: 0; }
    .card-panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px;
      margin-top: 16px;
    }
    .flashcard {
      min-height: 300px;
      margin: 16px 0;
      padding: 20px;
      border-radius: 14px;
      background: var(--panel2);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .card-label {
      text-transform: uppercase;
      letter-spacing: .08em;
      font-size: .75rem;
      color: var(--muted);
      margin-bottom: 10px;
    }
    .card-text {
      font-size: clamp(1.2rem, 4vw, 1.8rem);
      line-height: 1.5;
    }
    .answer {
      margin-top: 18px;
    }
    hr {
      border: 0;
      border-top: 1px solid var(--border);
      margin: 0 0 18px;
    }
    code {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 6px;
      padding: 0.05em 0.25em;
      font: 0.95em ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <header>
      <h1>LRA Flashcards</h1>
      <p class="muted">Organic Chemistry I</p>
    </header>

    <section class="card-panel">
      <article class="flashcard">
        <div class="card-label">Question</div>
        <div class="card-text">In a 1,2-cis disubstituted cyclohexane, what axial/equatorial relationships are possible?</div>

        <div class="answer">
          <hr>
          <div class="card-label">Answer</div>
          <div class="card-text"><code>a,e</code> or <code>e,a</code>.</div>
        </div>
      </article>
    </section>

    <section class="card-panel">
      <article class="flashcard">
        <div class="card-label">Question</div>
        <div class="card-text">In a 1,2-disubstituted cyclohexane, which cis/trans pattern has <code>a,e</code> or <code>e,a</code> relationships?</div>

        <div class="answer">
          <hr>
          <div class="card-label">Answer</div>
          <div class="card-text">1,2-cis disubstituted.</div>
        </div>
      </article>
    </section>
  </main>
</body>
</html>
